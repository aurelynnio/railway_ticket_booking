<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="36" />
  <!-- Inner ring (subtle) -->
  <circle cx="60" cy="60" r="48" opacity="0.2" stroke-dasharray="3 4" />
  <!-- Checkmark with draw-on animation -->
  <path d="M44 62 L 56 74 L 80 48" stroke-width="3" stroke-dasharray="60" stroke-dashoffset="60">
    <animate attributeName="stroke-dashoffset" from="60" to="0" dur="0.9s" begin="0s" fill="freeze" />
  </path>
  <!-- Brand accent dot -->
  <circle cx="60" cy="60" r="2" fill="#C8161D" stroke="none" opacity="0">
    <animate attributeName="opacity" values="0;0;1" dur="1s" begin="0.7s" fill="freeze" />
  </circle>
  <!-- Ring pulse -->
  <circle cx="60" cy="60" r="36" opacity="0">
    <animate attributeName="r" values="36;48" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0" dur="2.4s" repeatCount="indefinite" />
  </circle>
</svg>
