version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: railway-ticket-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: railway_ticket_booking
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      TZ: Asia/Bangkok
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - railway-ticket-network

  redis:
    image: redis:7.4-alpine
    container_name: railway-ticket-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - railway-ticket-network

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: railway-ticket-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      TZ: Asia/Bangkok
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - railway-ticket-network

  mongodb:
    image: mongo:7.0
    container_name: railway-ticket-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - railway-ticket-network

  elasticsearch:
    image: elasticsearch:8.17.0
    container_name: railway-ticket-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - railway-ticket-network

  # =========================================================================
  # BACKEND MICROSERVICES
  # =========================================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: railway-ticket-auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://app:app@mysql:3306/railway_auth
      JWT_SECRET: change-me
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - railway-ticket-network

  users-service:
    build:
      context: ./users-service
      dockerfile: Dockerfile
    container_name: railway-ticket-users-service
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://app:app@mysql:3306/railway_users
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - railway-ticket-network

  search-service:
    build:
      context: ./search-service
      dockerfile: Dockerfile
    container_name: railway-ticket-search-service
    restart: unless-stopped
    environment:
      DATABASE_URL: mongodb://mongodb:27017/railway_ticket_search
      RABBITMQ_URL: amqp://rabbitmq:5672
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - railway-ticket-network

  tickets-service:
    build:
      context: ./tickets-service
      dockerfile: Dockerfile
    container_name: railway-ticket-tickets-service
    restart: unless-stopped
    environment:
      DATABASE_URL: mongodb://mongodb:27017/railway_ticket_tickets
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - railway-ticket-network

  orders-service:
    build:
      context: ./orders-service
      dockerfile: Dockerfile
    container_name: railway-ticket-orders-service
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://app:app@mysql:3306/railway_orders
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - railway-ticket-network

  payments-service:
    build:
      context: ./payments-service
      dockerfile: Dockerfile
    container_name: railway-ticket-payments-service
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://app:app@mysql:3306/railway_payments
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - railway-ticket-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: railway-ticket-notification-service
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://app:app@mysql:3306/railway_notifications
      RABBITMQ_URL: amqp://rabbitmq:5672
      CLIENT_URL: http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - railway-ticket-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: railway-ticket-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      CLIENT_ORIGIN: http://localhost:3000
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - railway-ticket-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
    container_name: railway-ticket-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - railway-ticket-network

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  mongodb_data:
  elasticsearch_data:

networks:
  railway-ticket-network:
    driver: bridge
