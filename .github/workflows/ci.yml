name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-matrix:
    name: Test & Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - notification-service
          - orders-service
          - payments-service
          - tickets-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          npm ci

      - name: Generate Prisma client
        run: |
          cd ${{ matrix.service }}
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          fi

      - name: Run linter
        run: |
          cd ${{ matrix.service }}
          npm run lint

      - name: Compile and build
        run: |
          cd ${{ matrix.service }}
          npm run build

      - name: Execute unit tests
        run: |
          cd ${{ matrix.service }}
          npm test

  docker-compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          docker compose --env-file infra/docker/.env.docker.example -f infra/docker/docker-compose.yml config --profiles

  build-and-push-ecr:
    name: Build & Push (${{ matrix.service.name }})
    needs: [service-matrix, docker-compose-validate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            context: ./api-gateway
            file: ./api-gateway/Dockerfile
          - name: auth-service
            context: ./auth-service
            file: ./auth-service/Dockerfile
          - name: tickets-service
            context: ./tickets-service
            file: ./tickets-service/Dockerfile
          - name: orders-service
            context: ./orders-service
            file: ./orders-service/Dockerfile
          - name: payments-service
            context: ./payments-service
            file: ./payments-service/Dockerfile
          - name: notification-service
            context: ./notification-service
            file: ./notification-service/Dockerfile
          - name: db-migrate
            context: .
            file: ./infra/docker/Dockerfile.migrate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ matrix.service.name }}-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ matrix.service.name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ec2:
    name: Deploy to EC2
    needs: [build-and-push-ecr]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR (to get registry URI)
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Execute deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: AWS_REGION,ECR_REGISTRY,ECR_REPOSITORY,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting deployment on EC2..."

            if [ -d "/srv/railway-ticket" ]; then
              cd /srv/railway-ticket
            elif [ -d "$HOME/railway-ticket" ]; then
              cd "$HOME/railway-ticket"
            else
              echo "❌ Deployment directory (/srv/railway-ticket or ~/railway-ticket) not found!"
              exit 1
            fi

            # Ensure .env exists so docker compose automatically reads it
            if [ -f .env.docker ] && [ ! -f .env ]; then
              ln -sf .env.docker .env
            elif [ ! -f .env ] && [ -f .env.docker.example ]; then
              cp .env.docker.example .env
            fi

            echo "🔑 Logging in to Amazon ECR on EC2..."
            export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
            export AWS_DEFAULT_REGION="$AWS_REGION"
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            echo "📥 Pulling latest Docker images from ECR..."
            export ECR_REGISTRY="${ECR_REGISTRY}/"
            export ECR_REPOSITORY="$ECR_REPOSITORY"
            docker compose pull

            echo "🔄 Updating and running services with zero-downtime..."
            docker compose up -d --remove-orphans

            echo "🧹 Cleaning up old unused images..."
            docker image prune -af

            echo "✅ Deployment completed successfully!"
