name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-matrix:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - notification-service
          - orders-service
          - payments-service
          - tickets-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          npm ci

      - name: Generate Prisma client
        run: |
          cd ${{ matrix.service }}
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          fi

      - name: Run linter
        run: |
          cd ${{ matrix.service }}
          npm run lint

      - name: Compile and build
        run: |
          cd ${{ matrix.service }}
          npm run build

      - name: Execute unit tests
        run: |
          cd ${{ matrix.service }}
          npm test

  docker-compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          docker compose --env-file infra/docker/.env.docker.example -f infra/docker/docker-compose.yml config --profiles

  ci-status:
    name: CI Status Gate
    needs: [service-matrix, docker-compose-validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all CI jobs passed
        run: |
          if [ "${{ needs.service-matrix.result }}" != "success" ] || [ "${{ needs.docker-compose-validate.result }}" != "success" ]; then
            echo "CI pipeline failed!"
            exit 1
          fi
          echo "All CI pipeline checks passed successfully!"
