name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-matrix:
    name: Test & Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - notification-service
          - orders-service
          - payments-service
          - tickets-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          npm ci

      - name: Generate Prisma client
        run: |
          cd ${{ matrix.service }}
          if [ -f prisma/schema.prisma ]; then
            DATABASE_URL="postgresql://user:password@localhost:5432/db" npx prisma generate
          fi

      - name: Run linter
        continue-on-error: true
        run: |
          cd ${{ matrix.service }}
          npm run lint

      - name: Compile and build
        run: |
          cd ${{ matrix.service }}
          npm run build

      - name: Execute unit tests
        run: |
          cd ${{ matrix.service }}
          npm test

  docker-compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          docker compose --env-file infra/docker/.env.docker.example -f infra/docker/docker-compose.yml config --profiles

  build-and-push-ecr:
    name: Build & Push (${{ matrix.service.name }})
    needs: [service-matrix, docker-compose-validate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            context: ./api-gateway
            file: ./api-gateway/Dockerfile
          - name: auth-service
            context: ./auth-service
            file: ./auth-service/Dockerfile
          - name: tickets-service
            context: ./tickets-service
            file: ./tickets-service/Dockerfile
          - name: orders-service
            context: ./orders-service
            file: ./orders-service/Dockerfile
          - name: payments-service
            context: ./payments-service
            file: ./payments-service/Dockerfile
          - name: notification-service
            context: ./notification-service
            file: ./notification-service/Dockerfile
          - name: db-migrate
            context: .
            file: ./infra/docker/Dockerfile.migrate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ matrix.service.name }}-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ matrix.service.name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ec2:
    name: Deploy to EC2
    needs: [build-and-push-ecr]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR (to get registry URI)
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The compose file and nginx config live in THIS repository, not in the
      # images -- the images only carry application code. The host keeps its own
      # checkout, but nothing ever updated it, so infra changes in the repo
      # (published ports, env defaults, reverse-proxy config) never reached
      # production. Push the infra files from the CI workspace instead of relying
      # on the host's checkout being current.
      - name: Push infra files to the deployment host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: 'infra/docker/docker-compose.yml,infra/nginx/default.conf'
          target: '/srv/railway-ticket'
          overwrite: true

      - name: Execute deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: AWS_REGION,ECR_REGISTRY,ECR_REPOSITORY,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting deployment on EC2..."

            if [ -d "/srv/railway-ticket" ]; then
              cd /srv/railway-ticket
            elif [ -d "$HOME/railway-ticket" ]; then
              cd "$HOME/railway-ticket"
            else
              echo "❌ Deployment directory (/srv/railway-ticket or ~/railway-ticket) not found!"
              exit 1
            fi

            # The compose file and nginx config were pushed to this host by the
            # "Push infra files" step, from the CI workspace. Syncing the host's
            # own git checkout was tried before and reverted: it silently aborted
            # the whole deploy, and it would also undo the pushed files.
            echo "🔍 Using infra files at: $PWD/infra/docker/docker-compose.yml"
            ls -l infra/docker/docker-compose.yml || true

            # Fail closed instead of copying .env.docker.example into place.
            # Auto-copying used to let a deploy boot with repository-visible
            # placeholder secrets (including JWT_SECRET), which is equivalent to
            # publishing the token-signing key.
            if [ ! -f .env.docker ]; then
              echo "❌ .env.docker is missing on the deployment host."
              echo "   Create it from infra/docker/.env.docker.example and fill in real secrets:"
              echo "     openssl rand -hex 32   # for JWT_SECRET and every password"
              exit 1
            fi

            if grep -qE '^(JWT_SECRET|POSTGRES_PASSWORD|REDIS_PASSWORD|RABBITMQ_DEFAULT_PASS|VNPAY_SECURE_SECRET)=.*(replace-with|change-me|placeholder)' .env.docker; then
              echo "❌ .env.docker still contains placeholder secrets. Refusing to deploy."
              exit 1
            fi

            # Keep docker compose happy: it reads .env by default.
            if [ ! -f .env ]; then
              ln -sf .env.docker .env
            fi

            echo "🔑 Logging in to Amazon ECR on EC2..."
            export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
            export AWS_DEFAULT_REGION="$AWS_REGION"
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            # Free space BEFORE pulling. Every deploy pulls ~7 images, and the
            # `docker image prune` at the END of this script does not run when a
            # deploy fails -- so each failure left the disk fuller than it found
            # it, until `docker compose pull` began dying with
            # "no space left on device" and could not recover on its own.
            #
            # NEVER pass --volumes here: the named volumes hold the databases.
            echo "🧹 Freeing disk space before pulling images..."
            df -h / || true
            docker system df || true
            docker image prune -af || true
            docker builder prune -af || true
            docker system prune -f || true
            echo "--- disk after cleanup ---"
            df -h / || true

            echo "📥 Pulling latest Docker images from ECR..."
            export ECR_REGISTRY="${ECR_REGISTRY}/"
            export ECR_REPOSITORY="$ECR_REPOSITORY"
            docker compose pull

            echo "🔄 Updating and running services with zero-downtime..."
            docker compose up -d --remove-orphans

            echo "🧹 Cleaning up old unused images..."
            docker image prune -af

            echo "✅ Deployment completed successfully!"
