name: CD

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-images:
    name: Package ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            image_name: railway-api-gateway
          - service: auth-service
            image_name: railway-auth-service
          - service: notification-service
            image_name: railway-notification-service
          - service: orders-service
            image_name: railway-orders-service
          - service: payments-service
            image_name: railway-payments-service
          - service: tickets-service
            image_name: railway-tickets-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.service }}

  deploy:
    name: Deploy to Production
    needs: build-and-push-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH (if secrets configured)
        if: env.SSH_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /opt/railway_ticket_booking/infra/docker
            docker compose pull
            docker compose up -d --remove-orphans

      - name: Deployment Instructions & Status
        if: env.SSH_HOST == ''
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          echo "================================================================="
          echo "🚀 Containers successfully built and pushed to GitHub Packages!"
          echo "   Images: ghcr.io/${{ github.repository_owner }}/railway-*:latest"
          echo ""
          echo "To enable automated deployment on push, configure the following"
          echo "GitHub Actions repository secrets in Settings -> Secrets and variables -> Actions:"
          echo "  - SSH_HOST: Your server IP or domain"
          echo "  - SSH_USER: Your server SSH username"
          echo "  - SSH_KEY:  Your private SSH key for remote authentication"
          echo "  - SSH_PORT: (Optional) SSH port, default is 22"
          echo "================================================================="
