# Redis Replica configuration
# Được mount vào container redis-replica-1 và redis-replica-2

# Replication: theo master (tên DNS trong docker network)
# Sentinel sẽ tự cập nhật IP khi failover
replicaof redis-master 6379
masterauth 123456

# Replica cũng cần auth riêng (cho client connect trực tiếp)
requirepass 123456

# Replica chỉ đọc
replica-read-only yes

# Replica priority: số thấp = ưu tiên được promote lên master khi failover
# replica-1 ưu tiên hơn replica-2
replica-priority 100

# Persistence trên replica (dùng cho restart nhanh)
appendonly yes
appendfsync everysec

# Tối ưu
maxmemory 512mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""
