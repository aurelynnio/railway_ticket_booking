# Redis Master configuration
# Được mount vào container redis-master

# Persistence: AOF + RDB
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Auth
requirepass 123456
masterauth 123456

# Tối ưu cho booking system
maxmemory 512mb
maxmemory-policy allkeys-lru

# Replication: replica sẽ reconnect nhanh
repl-backlog-size 16mb
repl-backlog-ttl 3600
repl-diskless-sync yes
repl-diskless-sync-delay 5

# Logging
loglevel notice
logfile ""

# Bảo mật
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
