# Sentinel configuration
# Được mount vào 3 container sentinel-1, sentinel-2, sentinel-3
# File này là template - Sentinel sẽ tự ghi đè khi chạy (cần volume persistent)

# Resolve hostnames (required when using Docker container names/hostnames)
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Monitor master tên "mymaster" tại redis-master:6379
# Quorum = 2: cần 2/3 sentinel đồng ý master down mới failover
sentinel monitor mymaster redis-master 6379 2

# Thời gian master không phản hồi (ms) trước khi coi là down
# 5000ms = 5s (thấp để failover nhanh, phù hợp booking system)
sentinel down-after-milliseconds mymaster 5000

# Timeout cho toàn bộ quá trình failover (ms)
# 30000ms = 30s
sentinel failover-timeout mymaster 30000

# Số replica đồng bộ đồng thời khi failover (số thấp = ít block client)
sentinel parallel-syncs mymaster 1

# Auth: password để Sentinel kết nối tới Redis master/replica
sentinel auth-pass mymaster "__REDIS_PASSWORD__"

# Auth: password giữa các Sentinel với nhau
sentinel sentinel-pass "__REDIS_PASSWORD__"
requirepass "__REDIS_PASSWORD__"
