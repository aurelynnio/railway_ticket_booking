services:
  postgres:
    image: postgres:16-alpine
    container_name: railway-ticket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:-railway_ticket_booking}
      TZ: Asia/Bangkok
    # No port exposed to host — internal network only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-railway_ticket_booking}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - railway-ticket-network

  # =========================================================================
  # REDIS SENTINEL CLUSTER (1 Master + 2 Replica + 3 Sentinel)
  # - Sentinel tự động failover khi master down
  # - Quorum = 2/3 để tránh split-brain
  # - Replica tách tải đọc, master đảm bảo consistency cho write
  # Password is injected from REDIS_PASSWORD at container startup.
  # =========================================================================
  redis-master:
    image: redis:7.4-alpine
    container_name: railway-ticket-redis-master
    restart: unless-stopped
    # redis:7.4-alpine runs as uid 999 / gid 1000 — match the /data volume ownership
    user: "999:1000"
    mem_limit: 300m
    cpus: "0.25"
    command: ["sh", "/etc/redis/start-redis.sh", "master"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}
    volumes:
      - ./redis/redis-master.conf:/etc/redis/redis-master.conf:ro
      - ./redis/start-redis.sh:/etc/redis/start-redis.sh:ro
      - redis_master_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - railway-ticket-network

  redis-replica-1:
    image: redis:7.4-alpine
    container_name: railway-ticket-redis-replica-1
    restart: unless-stopped
    # redis:7.4-alpine runs as uid 999 / gid 1000 — match the /data volume ownership
    user: "999:1000"
    mem_limit: 300m
    cpus: "0.25"
    command: ["sh", "/etc/redis/start-redis.sh", "replica"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}
    volumes:
      - ./redis/redis-replica.conf:/etc/redis/redis-replica.conf:ro
      - ./redis/start-redis.sh:/etc/redis/start-redis.sh:ro
      - redis_replica1_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - railway-ticket-network

  redis-replica-2:
    image: redis:7.4-alpine
    container_name: railway-ticket-redis-replica-2
    restart: unless-stopped
    # redis:7.4-alpine runs as uid 999 / gid 1000 — match the /data volume ownership
    user: "999:1000"
    mem_limit: 300m
    cpus: "0.25"
    command: ["sh", "/etc/redis/start-redis.sh", "replica"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}
    volumes:
      - ./redis/redis-replica.conf:/etc/redis/redis-replica.conf:ro
      - ./redis/start-redis.sh:/etc/redis/start-redis.sh:ro
      - redis_replica2_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - railway-ticket-network

  redis-sentinel-1:
    image: redis:7.4-alpine
    container_name: railway-ticket-redis-sentinel-1
    restart: unless-stopped
    # redis:7.4-alpine runs as uid 999 / gid 1000 — match the /data volume ownership
    user: "999:1000"
    mem_limit: 300m
    cpus: "0.25"
    command: ["sh", "/etc/redis/start-redis.sh", "sentinel"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
      - ./redis/start-redis.sh:/etc/redis/start-redis.sh:ro
      - redis_sentinel1_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - railway-ticket-network

  redis-sentinel-2:
    image: redis:7.4-alpine
    container_name: railway-ticket-redis-sentinel-2
    restart: unless-stopped
    # redis:7.4-alpine runs as uid 999 / gid 1000 — match the /data volume ownership
    user: "999:1000"
    mem_limit: 300m
    cpus: "0.25"
    command: ["sh", "/etc/redis/start-redis.sh", "sentinel"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
      - ./redis/start-redis.sh:/etc/redis/start-redis.sh:ro
      - redis_sentinel2_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - railway-ticket-network

  redis-sentinel-3:
    image: redis:7.4-alpine
    container_name: railway-ticket-redis-sentinel-3
    restart: unless-stopped
    # redis:7.4-alpine runs as uid 999 / gid 1000 — match the /data volume ownership
    user: "999:1000"
    mem_limit: 300m
    cpus: "0.25"
    command: ["sh", "/etc/redis/start-redis.sh", "sentinel"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
      - ./redis/start-redis.sh:/etc/redis/start-redis.sh:ro
      - redis_sentinel3_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - railway-ticket-network

  # =========================================================================
  # RABBITMQ (Message Broker cho microservices)
  # =========================================================================
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: railway-ticket-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-railway}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env.docker}
      TZ: Asia/Bangkok
    # No port exposed to host — internal network only
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    mem_limit: 512m
    cpus: "0.50"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - railway-ticket-network

  # =========================================================================
  # MONGODB — REMOVED
  # tickets-service migrated to PostgreSQL (railway_tickets database).
  # The old MongoDB replica set existed only to support $transaction, which
  # PostgreSQL provides natively.
  # =========================================================================

  # Applies relational schema migrations before any PostgreSQL-backed service starts.
  db-migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.migrate
    container_name: railway-ticket-db-migrate
    restart: "no"
    environment:
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/railway_auth
      ORDERS_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/railway_orders
      PAYMENTS_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/railway_payments
      NOTIFICATION_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/railway_notifications
      TICKETS_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/railway_tickets
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - railway-ticket-network

  # =========================================================================
  # BACKEND MICROSERVICES
  # =========================================================================
  auth-service:
    build:
      context: ../../auth-service
      dockerfile: Dockerfile
    container_name: railway-ticket-auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/railway_auth
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-railway}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    # Pure RMQ microservice (no HTTP listener in main.ts) — no HTTP healthcheck possible
    mem_limit: 384m
    cpus: "0.50"
    networks:
      - railway-ticket-network

  tickets-service:
    build:
      context: ../../tickets-service
      dockerfile: Dockerfile
    container_name: railway-ticket-tickets-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/railway_tickets
      REDIS_SENTINELS: "redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379"
      REDIS_SENTINEL_NAME: "mymaster"
      REDIS_SENTINEL_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}"
      REDIS_DB: "0"
      REDIS_REPLICA_COUNT: "2"
      REDIS_CONNECT_TIMEOUT: "10000"
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-railway}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Pure RMQ microservice (no HTTP listener in main.ts) — no HTTP healthcheck possible
    mem_limit: 384m
    cpus: "0.50"
    networks:
      - railway-ticket-network

  orders-service:
    build:
      context: ../../orders-service
      dockerfile: Dockerfile
    container_name: railway-ticket-orders-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/railway_orders
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-railway}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672
      ORDER_EXPIRATION_TTL_MS: ${ORDER_EXPIRATION_TTL_MS:-600000}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    # RMQ-first service: main.ts starts microservices without app.listen() → no HTTP port to probe
    mem_limit: 384m
    cpus: "0.50"
    networks:
      - railway-ticket-network

  payments-service:
    build:
      context: ../../payments-service
      dockerfile: Dockerfile
    container_name: railway-ticket-payments-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/railway_payments
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-railway}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    # Pure RMQ microservice (no HTTP listener in main.ts) — no HTTP healthcheck possible
    mem_limit: 384m
    cpus: "0.50"
    networks:
      - railway-ticket-network

  notification-service:
    build:
      context: ../../notification-service
      dockerfile: Dockerfile
    container_name: railway-ticket-notification-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/railway_notifications
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-railway}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-user@example.com}
      SMTP_PASS: ${SMTP_PASS:?Set SMTP_PASS in .env.docker}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.com}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    # Pure RMQ microservice (no HTTP listener in main.ts) — no HTTP healthcheck possible
    mem_limit: 384m
    cpus: "0.50"
    networks:
      - railway-ticket-network

  api-gateway:
    build:
      context: ../../api-gateway
      dockerfile: Dockerfile
    container_name: railway-ticket-api-gateway
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN in .env.docker}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-railway}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      # VNPay Configuration
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_SECURE_SECRET: ${VNPAY_SECURE_SECRET:-}
      VNPAY_HOST: ${VNPAY_HOST:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_TEST_MODE: ${VNPAY_TEST_MODE:-true}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:?Set VNPAY_RETURN_URL in .env.docker}
      VNPAY_PUBLIC_BASE_URL: ${VNPAY_PUBLIC_BASE_URL:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
    # HTTP healthcheck: /auth/health is @Public() and round-trips to auth-service via RMQ
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 10 -O /dev/null http://localhost:8080/auth/health || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 30s
    mem_limit: 384m
    cpus: "0.50"
    networks:
      - railway-ticket-network

  client:
    profiles: ["with-client"]
    build:
      context: ${CLIENT_PATH:-../../../railway-ticket-client}
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env.docker}
    container_name: railway-ticket-client
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    mem_limit: 384m
    cpus: "0.50"
    depends_on:
      - api-gateway
    networks:
      - railway-ticket-network

  # =========================================================================
  # NGINX Reverse Proxy (optional — exposes port 80 when using --profile with-client)
  # Routes /api/* -> api-gateway:8080, /* -> client:3000
  # =========================================================================
  nginx:
    profiles: ["with-client"]
    image: nginx:1.27-alpine
    container_name: railway-ticket-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      client:
        condition: service_healthy
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - railway-ticket-network

volumes:
  postgres_data:
  redis_master_data:
  redis_replica1_data:
  redis_replica2_data:
  redis_sentinel1_data:
  redis_sentinel2_data:
  redis_sentinel3_data:
  rabbitmq_data:

networks:
  railway-ticket-network:
    driver: bridge
