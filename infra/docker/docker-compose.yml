version: "3.8"

# =============================================================================
# railway_ticket_booking — Production-ish Docker Compose
# Usage:
#   cp .env.docker.example .env.docker  # then edit secrets
#   docker compose --env-file .env.docker up -d --build
#
# Security notes:
# - DB/Redis/RabbitMQ/MongoDB ports are NOT exposed to host (internal network only)
# - Only nginx (80), api-gateway (8080), client (3000) are reachable from host
# - All secrets come from .env.docker (not committed to git)
# =============================================================================

services:
  # =========================================================================
  # POSTGRESQL (replaces MySQL — Prisma schemas use @db.Uuid which is PG-only)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: railway-ticket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-railway_ticket_booking}
      TZ: Asia/Bangkok
    # No port exposed to host — internal network only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-railway_ticket_booking}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - railway-ticket-network

  # =========================================================================
  # REDIS SENTINEL CLUSTER (1 Master + 2 Replica + 3 Sentinel)
  # - Sentinel tự động failover khi master down
  # - Quorum = 2/3 để tránh split-brain
  # - Replica tách tải đọc, master đảm bảo consistency cho write
  # NOTE: Redis password is set in infra/docker/redis/*.conf (currently "123456").
  #       Change it there AND in REDIS_PASSWORD below for production.
  # =========================================================================
  redis-master:
    image: redis:7.4-alpine
    container_name: railway-ticket-redis-master
    restart: unless-stopped
    command: ["redis-server", "/etc/redis/redis-master.conf"]
    volumes:
      - ./redis/redis-master.conf:/etc/redis/redis-master.conf:ro
      - redis_master_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-123456} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - railway-ticket-network

  redis-replica-1:
    image: redis:7.4-alpine
    container_name: railway-ticket-redis-replica-1
    restart: unless-stopped
    command: ["redis-server", "/etc/redis/redis-replica.conf"]
    volumes:
      - ./redis/redis-replica.conf:/etc/redis/redis-replica.conf:ro
      - redis_replica1_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-123456} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - railway-ticket-network

  redis-replica-2:
    image: redis:7.4-alpine
    container_name: railway-ticket-redis-replica-2
    restart: unless-stopped
    command: ["redis-server", "/etc/redis/redis-replica.conf"]
    volumes:
      - ./redis/redis-replica.conf:/etc/redis/redis-replica.conf:ro
      - redis_replica2_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-123456} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - railway-ticket-network

  redis-sentinel-1:
    image: redis:7.4-alpine
    container_name: railway-ticket-redis-sentinel-1
    restart: unless-stopped
    command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
      - redis_sentinel1_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 -a ${REDIS_PASSWORD:-123456} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - railway-ticket-network

  redis-sentinel-2:
    image: redis:7.4-alpine
    container_name: railway-ticket-redis-sentinel-2
    restart: unless-stopped
    command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
      - redis_sentinel2_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 -a ${REDIS_PASSWORD:-123456} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - railway-ticket-network

  redis-sentinel-3:
    image: redis:7.4-alpine
    container_name: railway-ticket-redis-sentinel-3
    restart: unless-stopped
    command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
      - redis_sentinel3_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 -a ${REDIS_PASSWORD:-123456} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - railway-ticket-network

  # =========================================================================
  # RABBITMQ (Message Broker cho microservices)
  # =========================================================================
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: railway-ticket-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-railway}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me}
      TZ: Asia/Bangkok
    # No port exposed to host — internal network only
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - railway-ticket-network

  # =========================================================================
  # MONGODB (cho tickets-service và search-service)
  # Replica set bắt buộc để tickets-service dùng $transaction
  # =========================================================================
  mongodb:
    image: mongo:7.0
    container_name: railway-ticket-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    # No port exposed to host — internal network only
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - railway-ticket-network

  # One-shot container: initiate MongoDB replica set
  mongo-init:
    image: mongo:7.0
    container_name: railway-ticket-mongo-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./init-mongo.js:/init-mongo.js:ro
    entrypoint: ["mongosh", "mongodb://mongodb:27017", "--file", "/init-mongo.js"]
    networks:
      - railway-ticket-network

  # =========================================================================
  # BACKEND MICROSERVICES
  # =========================================================================
  auth-service:
    build:
      context: ../../auth-service
      dockerfile: Dockerfile
    container_name: railway-ticket-auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/railway_auth
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-very-long-random-secret-at-least-32-characters}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-railway}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - railway-ticket-network

  users-service:
    build:
      context: ../../users-service
      dockerfile: Dockerfile
    container_name: railway-ticket-users-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/railway_users
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-railway}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - railway-ticket-network

  search-service:
    build:
      context: ../../search-service
      dockerfile: Dockerfile
    container_name: railway-ticket-search-service
    restart: unless-stopped
    environment:
      DATABASE_URL: mongodb://mongodb:27017/railway_ticket_search?replicaSet=rs0
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-railway}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - railway-ticket-network

  tickets-service:
    build:
      context: ../../tickets-service
      dockerfile: Dockerfile
    container_name: railway-ticket-tickets-service
    restart: unless-stopped
    environment:
      DATABASE_URL: mongodb://mongodb:27017/railway_ticket_tickets?replicaSet=rs0
      REDIS_SENTINELS: "redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379"
      REDIS_SENTINEL_NAME: "mymaster"
      REDIS_SENTINEL_PASSWORD: "${REDIS_PASSWORD:-123456}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-123456}"
      REDIS_DB: "0"
      REDIS_REPLICA_COUNT: "2"
      REDIS_CONNECT_TIMEOUT: "10000"
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-railway}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - railway-ticket-network

  orders-service:
    build:
      context: ../../orders-service
      dockerfile: Dockerfile
    container_name: railway-ticket-orders-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/railway_orders
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-railway}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672
      ORDER_EXPIRATION_TTL_MS: ${ORDER_EXPIRATION_TTL_MS:-600000}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - railway-ticket-network

  payments-service:
    build:
      context: ../../payments-service
      dockerfile: Dockerfile
    container_name: railway-ticket-payments-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/railway_payments
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-railway}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - railway-ticket-network

  notification-service:
    build:
      context: ../../notification-service
      dockerfile: Dockerfile
    container_name: railway-ticket-notification-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/railway_notifications
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-railway}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-user@example.com}
      SMTP_PASS: ${SMTP_PASS:-replace-with-smtp-password}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.com}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - railway-ticket-network

  api-gateway:
    build:
      context: ../../api-gateway
      dockerfile: Dockerfile
    container_name: railway-ticket-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-railway}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-very-long-random-secret-at-least-32-characters}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # VNPay Configuration
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_SECURE_SECRET: ${VNPAY_SECURE_SECRET:-}
      VNPAY_HOST: ${VNPAY_HOST:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_TEST_MODE: ${VNPAY_TEST_MODE:-true}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:8080/payments/vnpay/return}
      VNPAY_PUBLIC_BASE_URL: ${VNPAY_PUBLIC_BASE_URL:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - railway-ticket-network

  client:
    build:
      context: ../../client
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: railway-ticket-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - railway-ticket-network

  # =========================================================================
  # NGINX Reverse Proxy (optional — exposes port 80)
  # Routes /api/* -> api-gateway:8080, /* -> client:3000
  # =========================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: railway-ticket-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
      - client
    networks:
      - railway-ticket-network

volumes:
  postgres_data:
  redis_master_data:
  redis_replica1_data:
  redis_replica2_data:
  redis_sentinel1_data:
  redis_sentinel2_data:
  redis_sentinel3_data:
  rabbitmq_data:
  mongodb_data:

networks:
  railway-ticket-network:
    driver: bridge
