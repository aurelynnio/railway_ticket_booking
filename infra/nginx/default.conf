# =============================================================================
# Nginx Reverse Proxy cho railway_ticket_booking
# - /api/*  -> api-gateway:8080 (NestJS)
# - /*      -> client:3000      (Next.js)
# =============================================================================

upstream api_gateway_upstream {
  server api-gateway:8080;
  keepalive 32;
}

upstream client_upstream {
  server client:3000;
  keepalive 32;
}

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

server {
  listen 80;
  server_name _;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Download-Options "noopen" always;

  # Client max body size (for file uploads if needed)
  client_max_body_size 10m;

  # ========== API Gateway ==========
  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;

    # Strip /api prefix when forwarding to gateway
    rewrite ^/api/(.*)$ /$1 break;

    proxy_pass http://api_gateway_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # WebSocket / SSE support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;
  }

  # ========== Auth endpoints (stricter rate limit) ==========
  location ~ ^/api/auth/(login|forgot-password|reset-password|register|verify-email|resend-verification) {
    limit_req zone=auth_limit burst=10 nodelay;

    rewrite ^/api/(.*)$ /$1 break;

    proxy_pass http://api_gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # ========== VNPAY return (no rate limit, public) ==========
  location /api/payments/vnpay/ {
    rewrite ^/api/(.*)$ /$1 break;

    proxy_pass http://api_gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ========== Next.js Client ==========
  location / {
    proxy_pass http://client_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (Next.js HMR in dev)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}

# Map for WebSocket Connection header
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
